# Onboarding template -> copy to a project's .github/workflows/ci.yml
# Always-on tests/lint via the central reusable workflow.
# /pwnfactor:ci fills the `with:` commands from your .claude/orchestration-profile.md so CI runs
# YOUR real checks (per component, with any known-flaky suite routed to its stable subset).
name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  checks:
    uses: <your-org>/<your-repo>/.github/workflows/harness-ci.yml@v0.1.1
    with:
      # Fill from the profile's Test/lint/typecheck commands. Leave blank to auto-detect.
      setup-cmd: ""        # e.g. "pip install -e apps/server[dev] && pnpm -C apps/desktop install --frozen-lockfile"
      lint-cmd: ""         # e.g. "ruff check apps/server"
      typecheck-cmd: ""    # e.g. "pnpm -C apps/desktop exec tsc --noEmit"
      test-cmd: ""         # e.g. "pytest apps/server -q && pnpm -C apps/desktop exec vitest run && python packages/shared/tests/test_ts_parity.py"
    # Pin @v0.1.1 to a tag/SHA you maintain (supply-chain hygiene) - don't float on a branch.
